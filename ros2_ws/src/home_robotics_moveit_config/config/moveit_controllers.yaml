moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager
moveit_manage_controllers: false

moveit_simple_controller_manager:
  controller_names:
    - panda1_trajectory_controller
    - panda2_trajectory_controller
    - panda1_gripper_controller
    - panda2_gripper_controller

  panda1_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [panda1_rail_joint, panda1_joint1, panda1_joint2, panda1_joint3, panda1_joint4, panda1_joint5, panda1_joint6, panda1_joint7]
  panda2_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [panda2_rail_joint, panda2_joint1, panda2_joint2, panda2_joint3, panda2_joint4, panda2_joint5, panda2_joint6, panda2_joint7]
  panda1_gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints: [panda1_finger_joint1]
  panda2_gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints: [panda2_finger_joint1]
